name: Daily US Top500 Money Flow

on:
  schedule:
    - cron: '0 22 * * 1-5'  # UTC 22:00 ≈ 美股收盘后
  workflow_dispatch:        # 手动也可以触发

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install yfinance pandas openpyxl

      - run: python money_flow_top500.py

      - uses: actions/upload-artifact@v4
        with:
          name: daily-result
          path: |
            *.xlsx
            top500_streak.csv