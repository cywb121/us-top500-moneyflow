name: Daily US Top500 Money Flow

on:
  schedule:
    - cron: '0 22 * * 1-5'  # UTC 22:00 ≈ 美股收盘后
  workflow_dispatch:        # 手动触发

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库
      - uses: actions/checkout@v4

      # 2. 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl

      # 4. 运行 Python 脚本
      - name: Run money flow script
        run: python money_flow_top500.py

      # 5. 列出生成文件，方便调试
      - name: Check generated files
        run: ls -al

      # 6. 上传 Artifact（Excel + streak CSV）
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: daily-result
          path: |
            US_Top500_NetInflow_*.xlsx
            top500_streak.csv
          if-no-files-found: warn